# Runs every notebook (exercises and solutions) on Linux, macOS, and Windows.
# This is the "tested on all three systems" check before the workshop.
name: test-notebooks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"  # weekly, to catch breaking releases of dependencies

jobs:
  notebooks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python tools/run_all_notebooks.py
